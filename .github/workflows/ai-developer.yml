name: AI Developer

on:
  issues:
    types: [labeled]

concurrency:
  group: ai-developer-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  codex:
    name: Generate implementation
    if: github.event.label.name == 'ai-ready'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      final_message: ${{ steps.codex.outputs.final-message }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Codex Developer Agent
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt: |
            You are the LIFE OS implementation-only Developer Agent.

            First read `.github/agents/developer.md`, `docs/DEVELOPMENT.md`, and `ROADMAP.md`.
            Then implement GitHub Issue #${{ github.event.issue.number }}.

            Issue title:
            ${{ github.event.issue.title }}

            Issue body:
            ---
            ${{ github.event.issue.body }}
            ---

            Work only inside this checked-out repository.
            Follow the Issue scope exactly. Do not edit GitHub secrets, workflows, repository settings, agent configuration, or unrelated features.
            Do not commit or push. The workflow will handle Git operations after you finish editing files.
            If the task is ambiguous or requires a destructive Notion data change, do not guess; leave the code unchanged where necessary and explain the blocker in your final message.

      - name: Export implementation patch
        id: patch
        run: |
          git -c core.hooksPath=/dev/null add -A
          git -c core.hooksPath=/dev/null diff --cached --binary > "$RUNNER_TEMP/codex.patch"
          if [ -s "$RUNNER_TEMP/codex.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload implementation patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-patch-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/codex.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Verify and publish draft PR
    needs: codex
    if: needs.codex.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout clean main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download implementation patch
        uses: actions/download-artifact@v4
        with:
          name: codex-patch-${{ github.event.issue.number }}
          path: ${{ runner.temp }}

      - name: Apply and validate patch
        run: |
          git -c core.hooksPath=/dev/null apply --check "$RUNNER_TEMP/codex.patch"
          git -c core.hooksPath=/dev/null apply "$RUNNER_TEMP/codex.patch"

          FORBIDDEN=$(git diff --name-only | grep -E '^(\.github/workflows/|\.github/agents/)' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "AI Developer attempted to modify protected automation files:"
            echo "$FORBIDDEN"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck --workspace apps/web

      - name: Production build
        run: npm run build

      - name: Configure Git
        run: |
          git config user.name "life-os-ai-developer"
          git config user.email "actions@users.noreply.github.com"

      - name: Commit and push implementation branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="ai/issue-${ISSUE_NUMBER}"

          if git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists. Refusing to overwrite an existing AI implementation branch."
            exit 1
          fi

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "feat: implement issue #${ISSUE_NUMBER}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          CODEX_MESSAGE: ${{ needs.codex.outputs.final_message }}
        run: |
          cat > /tmp/pr-body.md <<EOF
          ## 概要

          AI DeveloperがIssue #${ISSUE_NUMBER}を実装しました。

          ## 関連Issue

          Closes #${ISSUE_NUMBER}

          ## Developer Agent report

          ${CODEX_MESSAGE}

          ## 自動確認

          - [x] TypeScript型チェック
          - [x] Production build
          - [ ] 人間またはProducerによるレビュー
          - [ ] スマホで必要な主要導線の確認

          ## 安全性

          - Draft PRとして作成
          - mainへの直接pushなし
          - 自動Mergeなし
          - Codex実行JobとGitHub書き込みJobを分離
          EOF

          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "$ISSUE_TITLE" \
            --body-file /tmp/pr-body.md

  report-no-change:
    name: Report blocked or no-change result
    needs: codex
    if: needs.codex.outputs.changed == 'false'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Comment on issue
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_MESSAGE: ${{ needs.codex.outputs.final_message }}
        run: |
          cat > /tmp/comment.md <<EOF
          AI Developerはコード変更を作成しませんでした。

          ${CODEX_MESSAGE}
          EOF
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/comment.md
