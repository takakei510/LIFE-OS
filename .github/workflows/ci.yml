name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check web app
        run: npm run typecheck --workspace apps/web

      - name: Test quest state transitions and repository boundaries
        run: npm run test:quests --workspace apps/web

      - name: Test title equipment switching
        run: node --experimental-strip-types --test apps/web/lib/life-os/title-equipment.test.mjs

      - name: Build web app
        run: npm run build

      - name: Test achievement tree privacy and prerequisite boundaries
        run: npm run test:tree --workspace apps/web
